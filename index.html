<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Empire Selector</title>
    <style>

        body { margin: 0; padding: 0; display: flex; height: 100vh; background: #0f172a; font-family: sans-serif; color: white; }
        .split { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: 0.3s; cursor: pointer; border: 1px solid #334155; }
        .split:hover { flex: 1.1; background: rgba(255,255,255,0.05); }
        
        /* Add borders between columns */
        .diamond-side { border-right: 1px solid #334155; }
        .textile-side { border-right: 1px solid #334155; }

        h1 { font-size: 2.5rem; margin: 0; }
        p { color: #94a3b8; letter-spacing: 1px; }
        
        .btn { margin-top: 20px; padding: 12px 30px; border-radius: 30px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
        
        .btn-diamond { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; box-shadow: 0 0 20px rgba(59, 130, 246, 0.5); }
        .btn-textile { background: linear-gradient(135deg, #f59e0b, #d97706); color: white; box-shadow: 0 0 20px rgba(245, 158, 11, 0.5); }
        .btn-saas { background: linear-gradient(135deg, #8b5cf6, #7c3aed); color: white; box-shadow: 0 0 20px rgba(139, 92, 246, 0.5); }

        .icon { font-size: 5rem; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="split diamond-side" onclick="location.href='dashboard.html'">
        <div class="icon">💎</div>
        <h1>Diamond</h1>
        <p>Amore Carets Finance</p>
        <a href="dashboard.html" class="btn btn-diamond">ENTER OFFICE</a>
    </div>


    <div class="split textile-side" onclick="location.href='textile.html'">
        <div class="icon">🧵</div>
        <h1>Textile</h1>
        <p>Manufacturing & Vendor Mgmt</p>
        <a href="textile.html" class="btn btn-textile">ENTER FACTORY</a>
    </div>

    <div class="split saas-side" onclick="location.href='saas.html'">
        <div class="icon">🚀</div>
        <h1>SaaS</h1>
        <p>CRM & Business Intelligence</p>
        <a href="saas.html" class="btn btn-saas">ENTER HQ</a>
    </div>

</body>
</html>
